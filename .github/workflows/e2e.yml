name: E2E test (live server)
on:
  push:
    branches: [main]
    paths: ['test/e2e.mjs', 'src/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node test/e2e.mjs
